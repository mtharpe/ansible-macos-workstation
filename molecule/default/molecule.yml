---
dependency:
  name: galaxy
driver:
  name: podman
platforms:
  - name: instance
    image: localhost/custom-macos-ansible-runner
    privileged: true
    command: sleep infinity
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/roles"
    ANSIBLE_REMOTE_TMP: "/tmp"
  playbooks:
    converge: converge.yml
verifier:
  name: ansible
