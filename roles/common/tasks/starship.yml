---
- name: Ensure ~/.config exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config"
    state: directory
    mode: '0755'

- name: Template starship config
  # Kept in step with ansible-fedora-workstation-base/templates/starship.toml.
  # If that file changes, update this one too (or refactor to a shared source).
  ansible.builtin.template:
    src: starship.toml.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/starship.toml"
    mode: '0644'
