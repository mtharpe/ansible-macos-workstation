---
- name: Ensure fish config directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/fish"
    state: directory
    mode: '0755'

- name: Template fish config
  ansible.builtin.template:
    src: config.fish.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/fish/config.fish"
    mode: '0644'

- name: Template system fish config (done notifications)
  ansible.builtin.template:
    src: system.fish.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/fish/system.fish"
    mode: '0644'

- name: Check if fish is in /etc/shells
  ansible.builtin.command: grep -q "/opt/homebrew/bin/fish" /etc/shells
  register: common_shell_fish_in_shells
  failed_when: false
  changed_when: false

- name: Add fish to /etc/shells
  ansible.builtin.lineinfile:
    path: /etc/shells
    line: /opt/homebrew/bin/fish
    state: present
  become: true
  when: common_shell_fish_in_shells.rc != 0

- name: Get current login shell
  ansible.builtin.command: dscl . -read /Users/{{ ansible_facts['user_id'] | default(local_user) }} UserShell
  register: common_shell_current_user_shell
  changed_when: false

- name: Change user shell to fish
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] | default(local_user) }}"
    shell: /opt/homebrew/bin/fish
  become: true
  when: "'/opt/homebrew/bin/fish' not in common_shell_current_user_shell.stdout"

# Fisher + pure-fish/pure. Kept parallel with
# ansible-fedora-workstation-base/roles/common/tasks/fish.yml so both machines
# render the same prompt. The `creates:` on fisher.fish is the idempotency
# check — once fisher is present we never re-run this shell command.
- name: Install Fisher and pure-fish/pure  # noqa: command-instead-of-module
  ansible.builtin.shell:
    cmd: >-
      curl -sL https://raw.githubusercontent.com/jorgebucaran/fisher/main/functions/fisher.fish | source &&
      fisher install jorgebucaran/fisher &&
      fisher install pure-fish/pure
    executable: /opt/homebrew/bin/fish
    creates: "{{ ansible_facts['env']['HOME'] }}/.config/fish/functions/fisher.fish"
