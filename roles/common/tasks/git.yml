---
- name: Configure Git user name
  community.general.git_config:
    name: user.name
    scope: global
    value: "{{ git_user_name }}"

- name: Configure Git user email
  community.general.git_config:
    name: user.email
    scope: global
    value: "{{ git_user_email }}"

- name: Configure init.defaultBranch
  community.general.git_config:
    name: init.defaultBranch
    scope: global
    value: main

- name: Configure GPG format to SSH
  community.general.git_config:
    name: gpg.format
    scope: global
    value: ssh

- name: Configure SSH signing key
  community.general.git_config:
    name: user.signingkey
    scope: global
    value: "{{ git_signing_key }}"
  when: git_signing_key is defined and git_signing_key != ""

- name: Configure SSH allowed signers file (for local signature verification)
  community.general.git_config:
    name: gpg.ssh.allowedSignersFile
    scope: global
    value: "~/.ssh/allowed_signers"
  when: git_signing_key is defined and git_signing_key != ""

- name: Configure GPG SSH program
  community.general.git_config:
    name: gpg.ssh.program
    scope: global
    value: "{{ git_gpg_program }}"
  when: git_gpg_program is defined and git_gpg_program != ""

- name: Unset GPG SSH program if empty
  community.general.git_config:
    name: gpg.ssh.program
    scope: global
    state: absent
  when: git_gpg_program is not defined or git_gpg_program == ""

- name: Enable commit GPG signing
  community.general.git_config:
    name: commit.gpgsign
    scope: global
    value: "true"
