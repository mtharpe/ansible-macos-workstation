---
- name: Check if Homebrew is installed
  ansible.builtin.stat:
    path: /opt/homebrew/bin/brew
  register: common_homebrew_check

- name: Check intel Homebrew location as fallback
  ansible.builtin.stat:
    path: /usr/local/bin/brew
  register: common_homebrew_intel_check
  when: not common_homebrew_check.stat.exists

- name: Install Homebrew if missing
  ansible.builtin.shell:
    cmd: |
      NONINTERACTIVE=1 /bin/bash -c \
        "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  when:
    - not common_homebrew_check.stat.exists
    - not (common_homebrew_intel_check.stat.exists | default(false))
  changed_when: true
