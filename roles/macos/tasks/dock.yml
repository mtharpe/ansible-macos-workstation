---
- name: Ensure user Applications directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/Applications"
    state: directory
    mode: '0755'

- name: Sync user-installed apps as clean wrappers to user Applications directory
  ansible.builtin.shell: |
    set -eo pipefail
    # Remove existing symlinks and managed wrapped apps
    find "{{ ansible_facts['env']['HOME'] }}/Applications" -maxdepth 1 -name "*.app" -exec sh -c '
      for d; do
        if [ -L "$d/Contents" ] || [ -L "$d" ]; then
          rm -rf "$d"
        fi
      done
    ' sh {} +

    # Create wrapped apps for each user-installed app in /Applications
    for app in /Applications/*.app; do
      [ -e "$app" ] || continue
      app_name="$(basename "$app")"
      dest_app="{{ ansible_facts['env']['HOME'] }}/Applications/$app_name"

      # Create the wrapper directory
      mkdir -p "$dest_app"

      # Symlink Contents folder inside it
      ln -sfh "$app/Contents" "$dest_app/Contents"
    done
  args:
    executable: /bin/bash
  changed_when: false
# macOS sometimes writes `tilesize` as a real (float) when the user
# adjusts the Dock size slider in System Settings, sometimes as an int.
# osx_defaults rejects the write if the requested type doesn't match
# the existing type, so we write as float (which the Dock accepts
# either way).
- name: Set Dock icon size
  community.general.osx_defaults:
    domain: com.apple.dock
    key: tilesize
    type: float
    value: "{{ macos_dock_tilesize | default(48) }}"
    state: present
  notify: Restart Dock

- name: Set Dock position
  community.general.osx_defaults:
    domain: com.apple.dock
    key: orientation
    type: string
    value: "{{ macos_dock_position }}"
    state: present
  notify: Restart Dock

- name: Set Dock autohide
  community.general.osx_defaults:
    domain: com.apple.dock
    key: autohide
    type: bool
    value: "{{ macos_dock_autohide | default(true) }}"
    state: present
  notify: Restart Dock

- name: Minimize windows into application icon
  community.general.osx_defaults:
    domain: com.apple.dock
    key: minimize-to-application
    type: bool
    value: "{{ macos_dock_minimize_to_app }}"
    state: present
  notify: Restart Dock

- name: Show recent applications in Dock
  community.general.osx_defaults:
    domain: com.apple.dock
    key: show-recents
    type: bool
    value: "{{ macos_dock_show_recents }}"
    state: present
  notify: Restart Dock

- name: Enable Dock magnification
  community.general.osx_defaults:
    domain: com.apple.dock
    key: magnification
    type: bool
    value: "{{ macos_dock_magnification }}"
    state: present
  notify: Restart Dock

# Dock layout — uses dockutil (installed via common/packages.yml).
# Strategy: read the current Dock once with `dockutil --list`, then add only
# entries that are missing. This keeps the play idempotent: a fully-correct
# Dock reports zero changes on the second run.
- name: Locate dockutil
  ansible.builtin.command: which dockutil
  register: macos_dockutil_bin
  changed_when: false
  failed_when: macos_dockutil_bin.rc != 0

- name: Read current Dock contents
  ansible.builtin.command: "{{ macos_dockutil_bin.stdout }} --list"
  register: macos_dock_current
  changed_when: false

- name: Remove system Applications folder from Dock
  ansible.builtin.command: "{{ macos_dockutil_bin.stdout }} --remove '/Applications' --no-restart"
  when: "'file:///Applications/' in macos_dock_current.stdout"
  register: macos_system_apps_dock_removed
  changed_when: macos_system_apps_dock_removed.rc == 0
  notify: Restart Dock

- name: Add Dock app entries (only if missing)
  ansible.builtin.command: >
    {{ macos_dockutil_bin.stdout }} --add "{{ item }}" --no-restart
  loop: "{{ macos_dock_apps | default([]) }}"
  loop_control:
    label: "{{ item }}"
  when: (item | basename | regex_replace('\\.app$', '')) not in macos_dock_current.stdout
  register: macos_dock_app_added
  changed_when: macos_dock_app_added.rc == 0
  notify: Restart Dock

- name: Add Dock folders / stacks (only if missing)
  ansible.builtin.command: >
    {{ macos_dockutil_bin.stdout }} --add "{{ item.path }}"
    --view {{ item.view | default('auto') }}
    --display {{ item.display | default('folder') }}
    --sort {{ item.sort | default('name') }}
    --no-restart
  loop: "{{ macos_dock_folders | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when: ("file://" + (item.path | replace('~', ansible_facts['env']['HOME']))) not in macos_dock_current.stdout
  register: macos_dock_folder_added
  changed_when: macos_dock_folder_added.rc == 0
  notify: Restart Dock
